# VERITAS AI: PostgreSQL + pgvector, the evidence service, the API and the web app.
#   cp .env.example .env   (fill in the secrets)
#   docker compose up --build
# Then open http://localhost:8080
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-evidence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ai:
    build: ./ai-service
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      EVIDENCE_DATABASE_URL: postgresql://veritas:${DB_PASSWORD}@postgres:5432/evidence
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
    volumes:
      - evidence-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # internal only: never published

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/veritas
      DB_USERNAME: veritas
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped
    # internal only: reached through nginx at /api

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  evidence-files:
  uploads:
